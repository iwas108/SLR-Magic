<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
        color: #333;
      }
      h2 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
        margin-top: 0;
      }
      .step {
        display: none;
      }
      .step.active {
        display: block;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #2980b9;
      }
      button.secondary {
        background-color: #7f8c8d;
      }
      .mapping-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      .mapping-table th, .mapping-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      .mapping-table th {
        background-color: #f2f2f2;
      }
      .loading {
        text-align: center;
        margin-top: 20px;
        font-style: italic;
        color: #666;
      }
      .report {
        background-color: #fff;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
    </style>
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <h2>Import Raw CSV</h2>

    <!-- Step 1: Input -->
    <div id="step1" class="step active">
      <div class="form-group">
        <label for="csvUrl">Google Drive CSV File</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="text" id="csvUrl" placeholder="Paste Google Drive File ID or use picker..." style="background-color: #fff;">
          <button type="button" onclick="loadPicker()" style="white-space: nowrap;">Select File</button>
        </div>
        <small style="color: #666; margin-top: 5px; display: block;">If the picker is blank, you can manually paste the File ID here.</small>
      </div>
      <div class="form-group">
        <label for="sourceName">Data Source Name</label>
        <input type="text" id="sourceName" placeholder="e.g. Scopus_2023_Part1">
      </div>
      <button onclick="fetchHeaders()">Next: Map Columns</button>
    </div>

    <!-- Step 2: Mapping -->
    <div id="step2" class="step">
      <p>Map the mandatory system columns to your CSV columns.</p>
      <table class="mapping-table">
        <thead>
          <tr>
            <th>System Header (Mandatory)</th>
            <th>Map From CSV Header</th>
          </tr>
        </thead>
        <tbody id="mandatoryMappingBody">
          <!-- Populated by JS -->
        </tbody>
      </table>

      <p>Map other columns from your CSV to the system columns.</p>
      <table class="mapping-table">
        <thead>
          <tr>
            <th>CSV Header</th>
            <th>Map To System Header</th>
          </tr>
        </thead>
        <tbody id="mappingBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
      <button class="secondary" onclick="showStep(1)">Back</button>
      <button onclick="runImport()">Start Import</button>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading" style="display:none;">
      Processing... Please wait.
    </div>

    <!-- Step 3: Report -->
    <div id="step3" class="step">
      <div class="report" id="reportContent">
        <!-- Populated by JS -->
      </div>
      <br>
      <button onclick="google.script.host.close()">Close</button>
    </div>

    <script>
      let csvHeaders = [];
      let systemHeaders = [];
      let pickerApiLoaded = false;
      let oauthToken = null;

      function onApiLoad() {
        gapi.load('picker', { 'callback': function() { pickerApiLoaded = true; } });
        google.script.run.withSuccessHandler(function(token) {
            oauthToken = token;
        }).getOAuthToken();
      }

      function loadPicker() {
        if (!pickerApiLoaded || !oauthToken) {
           alert('Google Picker API is still loading. Please try again in a few seconds.');
           return;
        }

        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
            .setIncludeFolders(true);

        const picker = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(oauthToken)
            // Apps Script origin prevents blank screens in some instances
            .setOrigin(google.script.host.origin)
            .setDeveloperKey('') // Required for standalone picker, blank if skipped but host origin might help
            .setCallback(pickerCallback)
            .build();
        picker.setVisible(true);
      }

      function pickerCallback(data) {
        if (data[google.picker.Response.ACTION] == google.picker.Action.PICKED) {
            const doc = data[google.picker.Response.DOCUMENTS][0];
            const id = doc[google.picker.Document.ID];
            document.getElementById('csvUrl').value = id;
        }
      }

      window.onload = onApiLoad;

      function showStep(n) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
      }

      function fetchHeaders() {
        const url = document.getElementById('csvUrl').value;
        const source = document.getElementById('sourceName').value;

        if (!url || !source) {
          alert("Please select a file and enter a Source Name.");
          return;
        }

        document.getElementById('step1').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = "Fetching headers...";

        google.script.run
          .withSuccessHandler(onHeadersFetched)
          .withFailureHandler(onFailure)
          .getCSVHeaders(url);
      }

      function onHeadersFetched(result) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('step1').style.display = 'block'; // Restore visibility logic handled by showStep

        if (!result) return;

        csvHeaders = result.csvHeaders;
        systemHeaders = result.systemHeaders;

        const mandatoryHeaders = ["Title", "Year", "Authors", "DOI"];
        const mandatoryTbody = document.getElementById('mandatoryMappingBody');
        mandatoryTbody.innerHTML = "";

        mandatoryHeaders.forEach(sysHeader => {
          const tr = document.createElement('tr');

          const tdSys = document.createElement('td');
          tdSys.innerText = sysHeader;
          tr.appendChild(tdSys);

          const tdDest = document.createElement('td');
          const select = document.createElement('select');

          const optSkip = document.createElement('option');
          optSkip.value = "";
          optSkip.text = "-- Select --";
          select.appendChild(optSkip);

          csvHeaders.forEach(csvHeader => {
            const opt = document.createElement('option');
            opt.value = csvHeader;
            opt.text = csvHeader;
            if (sysHeader.toLowerCase() === csvHeader.toLowerCase().replace(/_/g, ' ')) {
                opt.selected = true;
            }
            select.appendChild(opt);
          });

          tdDest.appendChild(select);
          tr.appendChild(tdDest);
          mandatoryTbody.appendChild(tr);
        });

        const tbody = document.getElementById('mappingBody');
        tbody.innerHTML = "";

        csvHeaders.forEach(header => {
          const tr = document.createElement('tr');

          const tdSrc = document.createElement('td');
          tdSrc.innerText = header;
          tr.appendChild(tdSrc);

          const tdDest = document.createElement('td');
          const select = document.createElement('select');

          // Default option: Skip
          const optSkip = document.createElement('option');
          optSkip.value = "";
          optSkip.text = "-- Skip --";
          select.appendChild(optSkip);

          // System Headers
          systemHeaders.forEach(sysHeader => {
            if (mandatoryHeaders.includes(sysHeader)) return;
            const opt = document.createElement('option');
            opt.value = sysHeader;
            opt.text = sysHeader;
            // Auto-select if matches (case-insensitive fuzzy match)
            if (sysHeader.toLowerCase() === header.toLowerCase().replace(/_/g, ' ')) {
                opt.selected = true;
            }
            select.appendChild(opt);
          });

          // Option to Create New
          const optNew = document.createElement('option');
          optNew.value = "_CREATE_NEW_";
          optNew.text = "[Create New Column]";
          select.appendChild(optNew);

          tdDest.appendChild(select);
          tr.appendChild(tdDest);
          tbody.appendChild(tr);
        });

        showStep(2);
      }

      function runImport() {
        const url = document.getElementById('csvUrl').value;
        const sourceName = document.getElementById('sourceName').value;

        const mapping = {};

        const mandatoryRows = document.getElementById('mandatoryMappingBody').querySelectorAll('tr');
        const mandatoryHeaders = ["Title", "Year", "Authors", "DOI"];
        let missingMandatory = false;

        mandatoryRows.forEach((row, index) => {
            const sysHeader = mandatoryHeaders[index];
            const select = row.querySelector('select');
            const selectedVal = select.value;

            if (selectedVal) {
                mapping[selectedVal] = sysHeader;
            } else {
                missingMandatory = true;
            }
        });

        if (missingMandatory) {
            alert("Please map all mandatory columns (Title, Year, Authors, DOI).");
            return;
        }

        const rows = document.getElementById('mappingBody').querySelectorAll('tr');
        rows.forEach((row, index) => {
            const csvHeader = csvHeaders[index];
            const select = row.querySelector('select');
            const selectedVal = select.value;

            // If a CSV header is already mapped in mandatory section, don't map it again unless intentionally overridden, but we should skip it here or let it be. Actually, mapping object key is CSV header.
            // If we set it here, we might overwrite. Let's ensure we only add if selected.
            if (selectedVal && !mapping[csvHeader]) {
                if (selectedVal === "_CREATE_NEW_") {
                    mapping[csvHeader] = csvHeader; // Use original name
                } else {
                    mapping[csvHeader] = selectedVal;
                }
            }
        });

        document.getElementById('step2').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerText = "Importing... This may take a while.";

        google.script.run
          .withSuccessHandler(onImportComplete)
          .withFailureHandler(onFailure)
          .processImport(url, sourceName, mapping);
      }

      function onImportComplete(report) {
        document.getElementById('loading').style.display = 'none';
        showStep(3);

        const div = document.getElementById('reportContent');
        div.innerHTML = `
          <h3>Import Complete</h3>
          <p><strong>Total Rows in CSV:</strong> ${report.totalRows}</p>
          <p><strong>Duplicates Skipped:</strong> ${report.duplicates}</p>
          <p><strong>Imported:</strong> ${report.imported}</p>
          <p><strong>Source:</strong> ${report.sourceName}</p>
        `;
      }

      function onFailure(e) {
        document.getElementById('loading').style.display = 'none';
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step1').classList.add('active'); // Go back to start
        alert("Error: " + e.message);
      }
    </script>
  </body>
</html>
