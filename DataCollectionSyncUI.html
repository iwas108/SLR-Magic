<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body { padding: 10px; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    .description { color: #666; font-size: 12px; margin-bottom: 10px; }
    #columnsContainer {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 5px;
      background-color: #fff;
    }
    .checkbox-item { display: block; margin-bottom: 5px; }
    .buttons { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>
  <h2>Sync to Data Collection</h2>
  <div class="description">
    This will sync all papers from '03_fulltext_screening' where <b>decision</b> is 'Include'.
    <br>The destination sheet '05_data_collection' will be overwritten.
  </div>

  <div class="form-group">
    <label>Select Columns to Sync</label>
    <div id="columnsContainer">
      <div style="color: #666; font-style: italic;">Loading columns...</div>
    </div>
  </div>

  <div class="buttons">
    <button class="share" onclick="google.script.host.close()">Cancel</button>
    <button class="action" id="syncBtn" onclick="runSync()" disabled>Sync Data</button>
  </div>

  <script>
    window.onload = function() {
      google.script.run
        .withSuccessHandler(populateColumns)
        .withFailureHandler(showError)
        .getDataCollectionColumns();
    };

    function populateColumns(data) {
      const container = document.getElementById('columnsContainer');
      container.innerHTML = '';

      // Backward compatibility if data is just array
      const sourceColumns = Array.isArray(data) ? data : (data.source || []);
      const destColumns = Array.isArray(data) ? [] : (data.destination || []);

      if (!sourceColumns || sourceColumns.length === 0) {
        container.innerHTML = 'No columns found.';
        return;
      }

      // Add "Select All"
      const selectAllDiv = document.createElement('div');
      selectAllDiv.className = 'checkbox-item';
      selectAllDiv.innerHTML = `<input type="checkbox" id="selectAll" onchange="toggleAll(this)"> <label for="selectAll" style="display:inline; font-weight:normal; cursor:pointer">Select All</label>`;
      container.appendChild(selectAllDiv);
      container.appendChild(document.createElement('hr'));

      // Default columns to check
      let columnsToCheck = ['Title', 'Abstract', 'Year', 'Authors', 'DOI_Link', 'Source_DB', 'PDF', 'decision'];

      // If destination has columns (other than just Paper_ID), use those instead
      if (destColumns.length > 0) {
        const existingFiltered = destColumns.filter(c => c !== 'Paper_ID');
        if (existingFiltered.length > 0) {
          columnsToCheck = destColumns;
        }
      }

      sourceColumns.forEach(col => {
        // Skip Paper_ID (mandatory)
        if (col !== 'Paper_ID') {
          const div = document.createElement('div');
          div.className = 'checkbox-item';

          const isChecked = columnsToCheck.includes(col) ? 'checked' : '';
          const escapedVal = String(col).replace(/"/g, '&quot;');

          div.innerHTML = `<input type="checkbox" name="syncColumn" value="${escapedVal}" ${isChecked}> <label style="display:inline; font-weight:normal"></label>`;
          div.querySelector('label').textContent = col;
          container.appendChild(div);
        }
      });

      document.getElementById('syncBtn').disabled = false;
    }

    function toggleAll(source) {
      const checkboxes = document.getElementsByName('syncColumn');
      for(let i=0; i<checkboxes.length; i++) {
        checkboxes[i].checked = source.checked;
      }
    }

    function runSync() {
      // Collect selected columns
      const checkboxes = document.getElementsByName('syncColumn');
      const selectedColumns = [];
      for (let i=0; i<checkboxes.length; i++) {
        if (checkboxes[i].checked) {
          selectedColumns.push(checkboxes[i].value);
        }
      }

      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.innerText = 'Syncing...';

      google.script.run
        .withSuccessHandler(function(msg) {
           alert(msg);
           google.script.host.close();
        })
        .withFailureHandler(function(e) {
           showError(e);
           btn.disabled = false;
           btn.innerText = 'Sync Data';
        })
        .syncDataCollection(selectedColumns);
    }

    function showError(e) {
      alert('Error: ' + e.message);
    }
  </script>
</body>
</html>
