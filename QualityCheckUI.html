<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 10px; max-width: 900px; margin: 0 auto; }
      .container { display: flex; flex-direction: column; gap: 10px; }

      .header-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 10px;
          border-bottom: 1px solid #eee;
      }

      .header-controls {
          display: flex;
          gap: 10px;
          align-items: center;
      }

      .human-view {
          flex: 1;
          border: 1px solid #ccc;
          padding: 10px;
          border-radius: 5px;
          overflow-y: auto;
          background-color: #f9f9f9;
          height: 350px;
      }

      .controls { border-top: 1px solid #eee; padding-top: 10px; }
      .control-group { margin-bottom: 10px; }
      .control-group label { display: inline-block; width: 200px; }

      .buttons { display: flex; justify-content: space-between; margin-top: 20px; }
      button { padding: 8px 16px; cursor: pointer; }
      .nav-buttons { display: flex; gap: 10px; }
      .loading { text-align: center; margin-top: 50px; }

      .copy-btn { font-size: 0.9em; padding: 6px 12px; }
      .finish-btn { background-color: #4CAF50; color: white; border: none; font-weight: bold; }

      .pdf-btn {
          display: inline-block;
          padding: 8px 16px;
          background-color: #db4437; /* PDF Red */
          color: white;
          text-decoration: none;
          border-radius: 4px;
          font-weight: bold;
      }
      .pdf-btn:hover { background-color: #c53929; }

      .key-label { font-weight: bold; color: #333; }
      .val-text { margin-bottom: 8px; display: block; word-wrap: break-word; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">Loading data...</div>
    </div>

    <script>
      let allRows = [];
      let currentIndex = 0;
      let currentPromptText = "";

      // Internal columns to hide
      const HIDDEN_COLUMNS = ["_rowIndex", "State"];

      function init() {
        google.script.run.withSuccessHandler(onDataLoaded).getQualityCheckData();
      }

      function onDataLoaded(response) {
        if (response && response.rows) {
            allRows = response.rows;
        } else if (Array.isArray(response)) {
            allRows = response;
        }

        if (allRows.length === 0) {
          document.getElementById('app').innerHTML = '<div class="loading">No unprocessed rows found in 03_quality_check.</div>';
          return;
        }
        currentIndex = 0;
        renderApp();
        renderRow();
      }

      function renderApp() {
        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="container">
            <div class="header-row">
              <div class="header-controls">
                <h3>Quality Check Assistant</h3>
                <button onclick="copyPrompt()" class="copy-btn" id="btnCopy">Copy AI Prompt</button>
              </div>
              <span id="pdfLinkContainer"></span>
            </div>

            <div class="human-view" id="humanDisplay">
                  <!-- Structured Data Goes Here -->
            </div>

            <div class="controls">
              <h3>Human Decision</h3>
              <div class="control-group">
                <label for="decisionAgree">Decision Agree:</label>
                <input type="checkbox" id="decisionAgree" onchange="syncData()">
              </div>
              <div class="control-group">
                <label for="reasonValid">Reasoning Valid:</label>
                <input type="checkbox" id="reasonValid" onchange="syncData()">
              </div>
              <div class="control-group">
                <label for="score">Data Extraction Score (1-5):</label>
                <select id="score" onchange="syncData()">
                  <option value="">Select...</option>
                  <option value="1">1 - Poor</option>
                  <option value="2">2 - Fair</option>
                  <option value="3">3 - Good</option>
                  <option value="4">4 - Very Good</option>
                  <option value="5">5 - Excellent</option>
                </select>
              </div>
              <div class="control-group">
                <label for="correction" style="vertical-align: top;">Critical Correction:</label>
                <textarea id="correction" rows="3" style="width: 100%;" onchange="syncData()"></textarea>
              </div>
            </div>

            <div class="buttons">
              <div class="nav-buttons">
                <button onclick="prevRow()" id="btnPrev">PREV</button>
                <button onclick="nextRow()" id="btnNext">NEXT</button>
              </div>
              <div>
                 <button onclick="finishRow()" id="btnFinish" class="finish-btn">FINISH & NEXT</button>
                 <button onclick="closeDialog()" style="margin-left: 10px;">CLOSE</button>
              </div>
            </div>
            <div style="text-align: right; font-size: 0.8em; color: #666;">
              Row <span id="rowDisplay"></span> of <span id="totalDisplay"></span>
            </div>
          </div>
        `;
      }

      function renderRow() {
        if (allRows.length === 0) return;
        const row = allRows[currentIndex];

        // 1. Build Data Strings
        let copyText = "";
        let humanHtml = "";

        for (const [key, value] of Object.entries(row)) {
          if (HIDDEN_COLUMNS.includes(key)) continue;
          if (key.startsWith("HUMAN_QC_")) continue;

          if (value !== null && value !== undefined && String(value).trim() !== "") {
            // Add to Copy Text
            copyText += `${key}: ${value}\n`;

            // Add to Human View
            humanHtml += `<span class="key-label">${key}:</span><br><span class="val-text">${escapeHtml(value)}</span>`;
          }
        }

        currentPromptText = copyText;
        document.getElementById('humanDisplay').innerHTML = humanHtml;

        // Reset Copy Button
        const btn = document.getElementById('btnCopy');
        if(btn) btn.textContent = "Copy AI Prompt";

        // Reset Finish Button
        const btnFinish = document.getElementById('btnFinish');
        if(btnFinish) {
            btnFinish.disabled = false;
            btnFinish.textContent = "FINISH & NEXT";
        }

        // PDF Link
        const pdfUrl = row["PDF"];
        const pdfContainer = document.getElementById('pdfLinkContainer');
        if (pdfUrl && String(pdfUrl).trim() !== "") {
          pdfContainer.innerHTML = `<a href="${pdfUrl}" target="_blank" class="pdf-btn">OPEN PDF</a>`;
        } else {
          pdfContainer.innerHTML = "<span style='color:#ccc;'>No PDF</span>";
        }

        // 2. Set Inputs
        document.getElementById('decisionAgree').checked = isTrue(row['HUMAN_QC_Decision_Agree']);
        document.getElementById('reasonValid').checked = isTrue(row['HUMAN_QC_Reason_Valid']);
        document.getElementById('score').value = row['HUMAN_QC_Data_Extraction_Score'] || "";
        document.getElementById('correction').value = row['HUMAN_QC_Critical_Correction'] || "";

        // 3. Update Status
        document.getElementById('rowDisplay').textContent = currentIndex + 1;
        document.getElementById('totalDisplay').textContent = allRows.length;

        document.getElementById('btnPrev').disabled = (currentIndex === 0);
        document.getElementById('btnNext').disabled = (currentIndex === allRows.length - 1);
      }

      function escapeHtml(text) {
          if (!text) return text;
          return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
      }

      function isTrue(val) {
        if (val === true) return true;
        if (typeof val === 'string' && val.toUpperCase() === 'TRUE') return true;
        return false;
      }

      function syncData() {
        const row = allRows[currentIndex];

        // Update local
        const decisionAgree = document.getElementById('decisionAgree').checked;
        const reasonValid = document.getElementById('reasonValid').checked;
        const score = document.getElementById('score').value;
        const correction = document.getElementById('correction').value;

        row['HUMAN_QC_Decision_Agree'] = decisionAgree;
        row['HUMAN_QC_Reason_Valid'] = reasonValid;
        row['HUMAN_QC_Data_Extraction_Score'] = score;
        row['HUMAN_QC_Critical_Correction'] = correction;

        // Send to server
        const updateData = {
          HUMAN_QC_Decision_Agree: decisionAgree,
          HUMAN_QC_Reason_Valid: reasonValid,
          HUMAN_QC_Data_Extraction_Score: score,
          HUMAN_QC_Critical_Correction: correction
        };

        google.script.run.saveQualityCheckRow(row.Paper_ID, updateData);
      }

      function finishRow() {
        const row = allRows[currentIndex];

        // Ensure latest values are captured
        const decisionAgree = document.getElementById('decisionAgree').checked;
        const reasonValid = document.getElementById('reasonValid').checked;
        const score = document.getElementById('score').value;
        const correction = document.getElementById('correction').value;

        const updateData = {
          HUMAN_QC_Decision_Agree: decisionAgree,
          HUMAN_QC_Reason_Valid: reasonValid,
          HUMAN_QC_Data_Extraction_Score: score,
          HUMAN_QC_Critical_Correction: correction,
          State: 1 // Mark as processed
        };

        const btn = document.getElementById('btnFinish');
        btn.disabled = true;
        btn.textContent = "Saving...";

        google.script.run
           .withSuccessHandler(() => {
               // Remove completed row from local list
               allRows.splice(currentIndex, 1);

               if (allRows.length === 0) {
                   document.getElementById('app').innerHTML = '<div class="loading">All rows processed!</div>';
                   setTimeout(() => google.script.host.close(), 2000);
                   return;
               }

               // If we were at the last element, step back
               if (currentIndex >= allRows.length) {
                   currentIndex = allRows.length - 1;
               }
               renderRow();
           })
           .withFailureHandler((err) => {
               alert("Error saving: " + err);
               btn.disabled = false;
               btn.textContent = "FINISH & NEXT";
           })
           .saveQualityCheckRow(row.Paper_ID, updateData);
      }

      function nextRow() {
        if (currentIndex < allRows.length - 1) {
          currentIndex++;
          renderRow();
        }
      }

      function prevRow() {
        if (currentIndex > 0) {
          currentIndex--;
          renderRow();
        }
      }

      function closeDialog() {
        google.script.host.close();
      }

      function copyPrompt() {
        navigator.clipboard.writeText(currentPromptText).then(function() {
          const btn = document.getElementById('btnCopy');
          btn.textContent = "Copied!";
          setTimeout(() => { btn.textContent = "Copy AI Prompt"; }, 2000);
        }, function(err) {
          console.error('Could not copy text: ', err);
          fallbackCopy(currentPromptText);
        });
      }

      function fallbackCopy(text) {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            const btn = document.getElementById('btnCopy');
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = "Copy AI Prompt"; }, 2000);
          } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
          }
          document.body.removeChild(textArea);
      }

      // Start
      init();
    </script>
  </body>
</html>
