<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; font-family: sans-serif; }
      .spinner-border { display: none; margin-right: 10px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h5>Export Blinded Review (.slr)</h5>
    <p>Select the sample size to export for blind inter-rater review. The system will perform stratified random sampling (50% AI Include, 50% AI Exclude) and shuffle the final dataset.</p>

    <div id="form-container">
      <div class="mb-3">
        <label for="sampleType" class="form-label">Sampling Method</label>
        <select class="form-select" id="sampleType">
          <option value="percentage">Percentage (%)</option>
          <option value="absolute">Absolute Number</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="sampleValue" class="form-label" id="sampleValueLabel">Percentage (e.g., 10 for 10%)</label>
        <input type="number" class="form-control" id="sampleValue" min="1" max="100" value="10">
      </div>

      <button id="exportBtn" class="btn btn-primary" onclick="startExport()">
        <span class="spinner-border spinner-border-sm" id="loadingSpinner" role="status" aria-hidden="true"></span>
        Generate Export
      </button>
    </div>

    <div id="result-container" class="hidden">
      <div class="alert alert-success" id="resultMessage"></div>
      <a id="downloadLink" class="btn btn-success" download="blinded_review.slr" href="#">Download .slr File</a>
      <button class="btn btn-secondary mt-2 d-block" onclick="google.script.host.close()">Close</button>
    </div>

    <script>
      const phase = "<?= phase ?>"; // Passed from server

      document.getElementById('sampleType').addEventListener('change', function(e) {
        const val = e.target.value;
        const input = document.getElementById('sampleValue');
        const label = document.getElementById('sampleValueLabel');
        if (val === 'percentage') {
          label.textContent = "Percentage (e.g., 10 for 10%)";
          input.max = 100;
          input.value = 10;
        } else {
          label.textContent = "Number of Papers (e.g., 100)";
          input.removeAttribute('max');
          input.value = 100;
        }
      });

      function startExport() {
        const sampleType = document.getElementById('sampleType').value;
        const sampleValue = document.getElementById('sampleValue').value;

        if (!sampleValue || sampleValue <= 0) {
          alert("Please enter a valid positive number.");
          return;
        }

        document.getElementById('exportBtn').disabled = true;
        document.getElementById('loadingSpinner').style.display = 'inline-block';

        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .processInterRaterExport(phase, sampleType, Number(sampleValue));
      }

      function onSuccess(response) {
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('form-container').classList.add('hidden');
        document.getElementById('result-container').classList.remove('hidden');

        document.getElementById('resultMessage').innerText = response.message;

        // Set up the download link
        const blob = new Blob([response.jsonPayload], { type: "application/json" });
        const dataUrl = URL.createObjectURL(blob);
        const dlLink = document.getElementById('downloadLink');
        dlLink.href = dataUrl;
        dlLink.download = `${phase}_blinded_review.slr`;
      }

      function onFailure(error) {
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('loadingSpinner').style.display = 'none';
        alert("Export failed: " + error.message);
      }
    </script>
  </body>
</html>
