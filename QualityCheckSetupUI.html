<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 20px; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      select, input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
      button { padding: 10px 20px; background-color: #4285f4; color: white; border: none; cursor: pointer; }
      button:disabled { background-color: #ccc; }
      .error { color: red; margin-top: 10px; }
      .checkbox-container {
        border: 1px solid #ccc;
        padding: 10px;
        max-height: 150px;
        overflow-y: auto;
      }
      .checkbox-item {
        display: block;
        margin-bottom: 5px;
      }
      .checkbox-item input {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Quality Check Configuration</h2>
    <p>Configure how the Quality Check sheet is generated.</p>

    <div class="form-group">
      <label for="decisionCol">AI Decision / Recommendation Column:</label>
      <select id="decisionCol" disabled>
        <option>Loading...</option>
      </select>
      <small>Select the column containing "Include" / "Exclude".</small>
    </div>

    <div class="form-group">
      <label for="reasoningCol">AI Reasoning Column (Optional):</label>
      <select id="reasoningCol" disabled>
        <option>Loading...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Sampling Percentages:</label>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
           <label for="samplePercentInclude" style="font-weight: normal; font-size: 0.9em;">Included Rows (%):</label>
           <input type="number" id="samplePercentInclude" value="10" min="1" max="100">
        </div>
        <div style="flex: 1;">
           <label for="samplePercentExclude" style="font-weight: normal; font-size: 0.9em;">Excluded Rows (%):</label>
           <input type="number" id="samplePercentExclude" value="10" min="1" max="100">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Columns to Copy to Quality Check Sheet:</label>
      <div id="columnsContainer" class="checkbox-container">
        Loading...
      </div>
      <small>Select columns to include in the QC review.</small>
    </div>

    <button id="saveBtn" disabled onclick="saveConfig()">Save Configuration</button>
    <div id="status" class="error"></div>

    <script>
      function loadColumns() {
        google.script.run
          .withSuccessHandler(populateForm)
          .withFailureHandler(showError)
          .getFullTextScreeningColumns();
      }

      function populateForm(columns) {
        const decisionSelect = document.getElementById('decisionCol');
        const reasoningSelect = document.getElementById('reasoningCol');
        const columnsContainer = document.getElementById('columnsContainer');

        // Clear loading
        decisionSelect.innerHTML = '';
        reasoningSelect.innerHTML = '';
        columnsContainer.innerHTML = '';

        // Add empty option
        const addOption = (select, text, val) => {
            const opt = document.createElement('option');
            opt.text = text;
            opt.value = val;
            select.add(opt);
        };

        addOption(decisionSelect, '-- Select Column --', '');
        addOption(reasoningSelect, '-- Select Column --', '');

        columns.forEach(col => {
           // Populate Selects
           addOption(decisionSelect, col, col);
           addOption(reasoningSelect, col, col);

           // Populate Checkboxes
           const label = document.createElement('label');
           label.className = 'checkbox-item';

           const checkbox = document.createElement('input');
           checkbox.type = 'checkbox';
           checkbox.value = col;
           checkbox.name = 'columnsToCopy';

           // Mandatory PDF
           if (col === 'PDF') {
              checkbox.checked = true;
              checkbox.disabled = true; // Cannot uncheck
           } else if (['Title', 'Abstract', 'DOI_Link'].includes(col)) {
              checkbox.checked = true;
           }

           label.appendChild(checkbox);
           label.appendChild(document.createTextNode(col));

           if (col === 'PDF') {
             const span = document.createElement('span');
             span.style.color = '#666';
             span.style.fontSize = '0.9em';
             span.innerText = ' (Mandatory)';
             label.appendChild(span);
           }

           columnsContainer.appendChild(label);
        });

        decisionSelect.disabled = false;
        reasoningSelect.disabled = false;
        document.getElementById('saveBtn').disabled = false;
      }

      function saveConfig() {
        const decision = document.getElementById('decisionCol').value;
        const reasoning = document.getElementById('reasoningCol').value;
        const includePct = document.getElementById('samplePercentInclude').value;
        const excludePct = document.getElementById('samplePercentExclude').value;

        // Get selected columns
        const checkboxes = document.querySelectorAll('input[name="columnsToCopy"]:checked');
        const columnsToCopy = Array.from(checkboxes).map(cb => cb.value);

        if (!decision) {
          showError("Please select the Decision column.");
          return;
        }

        if (!includePct || includePct <= 0 || includePct > 100) {
            showError("Please enter a valid Include percentage (1-100).");
            return;
        }

        if (!excludePct || excludePct <= 0 || excludePct > 100) {
            showError("Please enter a valid Exclude percentage (1-100).");
            return;
        }

        if (columnsToCopy.length === 0) {
            showError("Please select at least one column to copy.");
            return;
        }

        document.getElementById('saveBtn').disabled = true;
        document.getElementById('saveBtn').textContent = "Saving...";

        const config = {
           decisionColumn: decision,
           reasoningColumn: reasoning,
           samplePercentInclude: parseInt(includePct),
           samplePercentExclude: parseInt(excludePct),
           columnsToCopy: columnsToCopy
        };

        google.script.run
          .withSuccessHandler(onSaveSuccess)
          .withFailureHandler(showError)
          .saveQualityCheckConfig(config);
      }

      function onSaveSuccess() {
         document.getElementById('status').style.color = 'green';
         document.getElementById('status').textContent = 'Configuration saved! You can close this dialog.';
         setTimeout(() => google.script.host.close(), 2000);
      }

      function showError(err) {
        document.getElementById('status').style.color = 'red';
        document.getElementById('status').textContent = "Error: " + err;
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').textContent = "Save Configuration";
      }

      window.onload = loadColumns;
    </script>
  </body>
</html>
