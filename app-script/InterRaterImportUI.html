<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Import Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans leading-normal tracking-normal p-4 min-h-screen">
    
    <!-- Top Header -->
    <div class="bg-gradient-to-r from-indigo-700 via-indigo-800 to-slate-900 text-white p-4 rounded-2xl shadow-md mb-4">
      <h1 class="text-base font-bold tracking-tight">Import Blinded Results (.slr)</h1>
      <p class="text-indigo-200 text-[10px] mt-0.5">Upload completed blinded review JSON files back into the spreadsheet pool row indices.</p>
    </div>

    <div id="form-container" class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-4">
      
      <!-- Pool Selector -->
      <div>
        <label for="poolType" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Target Calibration Pool</label>
        <select id="poolType" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
          <option value="CAL_Pool_A">CAL_Pool_A (Stage 1 Filter)</option>
          <option value="CAL_Pool_B">CAL_Pool_B (Stage 2.1 Gatekeeper)</option>
          <option value="CAL_Pool_C">CAL_Pool_C (Stage 2.2/2.3 Scientist & Miner)</option>
          <option value="QC_Audit_Batch">QC_Audit_Batch (Phase 3 QC Auditor)</option>
        </select>
      </div>

      <!-- File Upload Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Completed .slr / .json File</label>
        <input type="file" id="fileInput" accept=".slr,.json"
               class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all cursor-pointer">
      </div>

      <button id="importBtn" onclick="startImport()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-sm transition-all flex items-center justify-center cursor-pointer">
        <svg id="loadingSpinner" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white hidden" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Execute Results Import
      </button>
    </div>

    <!-- Alert / Output Box -->
    <div id="result-container" class="hidden bg-indigo-50 border border-indigo-100 p-4 rounded-2xl text-xs text-indigo-700 mt-4 leading-relaxed"></div>

    <script>
      const defaultPhase = "<?= phase ?>"; // Default phase from GAS menu entry

      document.addEventListener('DOMContentLoaded', () => {
        const poolSelect = document.getElementById('poolType');
        if (defaultPhase === 'full-text') {
          poolSelect.value = 'CAL_Pool_C';
        } else if (defaultPhase === 'CAL_Pool_B') {
          poolSelect.value = 'CAL_Pool_B';
        } else if (defaultPhase === 'QC_Audit_Batch') {
          poolSelect.value = 'QC_Audit_Batch';
        } else {
          poolSelect.value = 'CAL_Pool_A';
        }
      });

      // Secure Toast Notification System
      function showToast(message, type = 'success') {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-5 right-5 z-[100] flex flex-col gap-2';
          document.body.appendChild(container);
        }
        
        const toast = document.createElement('div');
        toast.className = 'px-4 py-3 rounded-xl shadow-lg border text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2 min-w-[250px] max-w-sm';
        
        const isSuccess = type === 'success';
        toast.classList.add(
          isSuccess ? 'bg-emerald-50' : 'bg-rose-50',
          isSuccess ? 'text-emerald-800' : 'text-rose-800',
          isSuccess ? 'border-emerald-200' : 'border-rose-200'
        );
        
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', `w-4 h-4 shrink-0 ${isSuccess ? 'text-emerald-600' : 'text-rose-600'}`);
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('viewBox', '0 0 24 24');
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('d', isSuccess ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z');
        
        svg.appendChild(path);
        toast.appendChild(svg);
        
        const span = document.createElement('span');
        span.className = 'flex-1';
        span.textContent = message;
        toast.appendChild(span);
        
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      function startImport() {
        const fileInput = document.getElementById('fileInput');
        const poolType = document.getElementById('poolType').value;

        if (fileInput.files.length === 0) {
          showToast("Please select a file first.", "error");
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
          const contents = e.target.result;

          document.getElementById('importBtn').disabled = true;
          document.getElementById('loadingSpinner').classList.remove('hidden');

          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .processInterRaterImport(poolType, contents);
        };

        reader.onerror = function() {
          showToast("FileReader failed to parse the file.", "error");
        };

        reader.readAsText(file);
      }

      function onSuccess(response) {
        document.getElementById('importBtn').disabled = false;
        document.getElementById('loadingSpinner').classList.add('hidden');

        const resContainer = document.getElementById('result-container');
        resContainer.classList.remove('hidden');
        resContainer.innerText = response;
        showToast(response, "success");
      }

      function onFailure(error) {
        document.getElementById('importBtn').disabled = false;
        document.getElementById('loadingSpinner').classList.add('hidden');
        showToast("Import failed: " + error.message, "error");
      }
    </script>
  </body>
</html>
