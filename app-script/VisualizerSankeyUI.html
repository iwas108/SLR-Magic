<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Import Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans leading-normal tracking-normal p-4 min-h-screen">

  <!-- Step 1: Select Columns -->
  <div id="step-1" class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm space-y-4">
    <div class="space-y-1">
      <h2 class="text-base font-bold text-slate-900">Step 1: Select Columns</h2>
      <p class="text-xs text-slate-500">Select the columns you want to visualize in the Sankey Diagram.</p>
    </div>
    
    <div id="column-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-72 overflow-y-auto p-2.5 border border-slate-200 bg-slate-50 rounded-xl">
      <!-- Populated by JS -->
      <div class="text-slate-400 text-xs italic p-2">Loading columns...</div>
    </div>
    
    <div class="flex justify-end pt-2">
      <button class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="goToStep2()">Next: Configure Connections</button>
    </div>
  </div>

  <!-- Step 2: Configure Connections -->
  <div id="step-2" class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm space-y-4 hidden">
    <div class="space-y-1">
      <h2 class="text-base font-bold text-slate-900">Step 2: Configure Connections</h2>
      <p class="text-xs text-slate-500">Order the columns to define the flow (Source &rarr; Target). Specify a separator (e.g., comma) if a cell contains multiple values.</p>
    </div>

    <div class="space-y-3.5 max-w-xl">
      <div>
          <label for="chart-title" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Chart Title</label>
          <input type="text" id="chart-title" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-sans" placeholder="Enter chart title">
      </div>

      <div id="config-list" class="border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-100 bg-white">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="goToStep1()">Back</button>
      <button class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="generateDiagram()">Generate Diagram</button>
    </div>
  </div>

  <!-- Step 3: Visualization -->
  <div id="step-3" class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm space-y-4 hidden">
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
        <h2 class="text-base font-bold text-slate-900">Sankey Diagram</h2>
        <div class="flex flex-wrap gap-2">
            <button class="px-3.5 py-1.5 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="goToStep2()">Back to Config</button>
            <button class="px-3.5 py-1.5 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="toggleFullscreen()">Fullscreen</button>
            <button class="px-3.5 py-1.5 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="downloadChart('svg')">Download SVG</button>
            <button class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors cursor-pointer" onclick="downloadChart('png')">Download PNG</button>
        </div>
    </div>
    <div id="chart-container" class="w-full h-[550px] border border-slate-150 rounded-xl bg-white shadow-sm overflow-hidden animate-fade-in"></div>
  </div>

  <script>
    // Secure Toast Notification System
    function showToast(message, type = 'success') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed bottom-5 right-5 z-[100] flex flex-col gap-2';
        document.body.appendChild(container);
      }
      
      const toast = document.createElement('div');
      toast.className = 'px-4 py-3 rounded-xl shadow-lg border text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2 min-w-[250px] max-w-sm';
      
      const isSuccess = type === 'success';
      toast.classList.add(
        isSuccess ? 'bg-emerald-50' : 'bg-rose-50',
        isSuccess ? 'text-emerald-800' : 'text-rose-800',
        isSuccess ? 'border-emerald-200' : 'border-rose-200'
      );
      
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', `w-4 h-4 shrink-0 ${isSuccess ? 'text-emerald-600' : 'text-rose-600'}`);
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('viewBox', '0 0 24 24');
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('d', isSuccess ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z');
      
      svg.appendChild(path);
      toast.appendChild(svg);
      
      const span = document.createElement('span');
      span.className = 'flex-1';
      span.textContent = message;
      toast.appendChild(span);
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    let availableColumns = [];
    let selectedColumns = []; // Array of objects { name: "Col", separator: "" }
    let chartTitle = "";
    let chartInstance = null;
    let lastChartData = null;

    // Initialize
    window.onload = function() {
      if (typeof google === 'undefined') {
         setTimeout(() => renderColumnSelection(["Col A", "Col B", "Col C"]), 500);
         return;
      }

      google.script.run
        .withSuccessHandler(renderColumnSelection)
        .withFailureHandler(showError)
        .getVisualizerColumns();
    };

    function showError(err) {
      const container = document.getElementById('column-list');
      container.innerHTML = `<div class="text-rose-600 text-xs p-4 bg-rose-50 border border-rose-100 rounded-xl">Error: ${err.message}</div>`;
    }

    // Step 1 Logic
    function renderColumnSelection(columns) {
      availableColumns = columns;
      const container = document.getElementById('column-list');
      container.innerHTML = '';

      if (!columns || columns.length === 0) {
        container.innerHTML = '<div class="text-slate-400 text-xs italic p-2">No columns found.</div>';
        return;
      }

      columns.forEach(col => {
        const div = document.createElement('div');
        div.className = 'flex items-center text-xs text-slate-700 bg-white border border-slate-200/50 p-2.5 rounded-lg hover:border-slate-300 transition-colors';

        const label = document.createElement('label');
        label.className = 'select-none cursor-pointer flex items-center w-full';

        const input = document.createElement('input');
        input.type = "checkbox";
        input.name = "columnSelection";
        input.value = col;
        input.className = 'mr-2 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 w-3.5 h-3.5 cursor-pointer';
        
        const isSel = selectedColumns.find(c => c.name === col);
        if (isSel) input.checked = true;

        const span = document.createElement('span');
        span.textContent = col;

        label.appendChild(input);
        label.appendChild(span);
        div.appendChild(label);
        container.appendChild(div);
      });
    }

    function goToStep2() {
      const checkedInputs = document.querySelectorAll('input[name="columnSelection"]:checked');
      if (checkedInputs.length < 2) {
        showToast("Please select at least 2 columns to visualize connections.", "error");
        return;
      }

      // Rebuild selectedColumns array keeping existing configurations (separators) if possible
      const newSelected = [];
      checkedInputs.forEach(input => {
         const colName = input.value;
         const existing = selectedColumns.find(c => c.name === colName);
         if (existing) {
             newSelected.push(existing);
         } else {
             newSelected.push({ name: colName, separator: "" });
         }
      });
      selectedColumns = newSelected;

      // Auto-generate title if empty
      if (!chartTitle) {
          document.getElementById('chart-title').value = selectedColumns.map(c => c.name).join(' ➔ ');
      }

      renderConfigList();

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
      document.getElementById('step-3').classList.add('hidden');
    }

    function goToStep1() {
      chartTitle = document.getElementById('chart-title').value;
      renderColumnSelection(availableColumns); 

      document.getElementById('step-1').classList.remove('hidden');
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden');
    }

    // Step 2 Logic
    function renderConfigList() {
      const container = document.getElementById('config-list');
      container.innerHTML = '';

      selectedColumns.forEach((col, index) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-3.5 bg-slate-50/50';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'text-xs font-semibold text-slate-800';
        nameDiv.textContent = `${index + 1}. ${col.name}`;

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'flex items-center gap-2';

        const label = document.createElement('label');
        label.className = 'text-[10px] font-bold text-slate-500 uppercase tracking-wider';
        label.textContent = "Separator:";

        const input = document.createElement('input');
        input.type = "text";
        input.className = "w-16 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-mono";
        input.placeholder = "e.g. ,";
        input.value = col.separator;
        input.onchange = function() { updateSeparator(index, this.value); };

        const btnUp = document.createElement('button');
        btnUp.className = "px-2 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-30 disabled:hover:bg-slate-100 font-bold text-slate-700 text-xs rounded transition-colors cursor-pointer";
        btnUp.onclick = function() { moveUp(index); };
        btnUp.disabled = (index === 0);
        btnUp.title = "Move Up";
        btnUp.innerHTML = "&uarr;"; 

        const btnDown = document.createElement('button');
        btnDown.className = "px-2 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-30 disabled:hover:bg-slate-100 font-bold text-slate-700 text-xs rounded transition-colors cursor-pointer";
        btnDown.onclick = function() { moveDown(index); };
        btnDown.disabled = (index === selectedColumns.length - 1);
        btnDown.title = "Move Down";
        btnDown.innerHTML = "&darr;"; 

        controlsDiv.appendChild(label);
        controlsDiv.appendChild(input);
        controlsDiv.appendChild(btnUp);
        controlsDiv.appendChild(btnDown);

        div.appendChild(nameDiv);
        div.appendChild(controlsDiv);

        container.appendChild(div);
      });
    }

    function updateSeparator(index, val) {
      selectedColumns[index].separator = val;
    }

    function moveUp(index) {
      if (index > 0) {
        const temp = selectedColumns[index];
        selectedColumns[index] = selectedColumns[index - 1];
        selectedColumns[index - 1] = temp;
        renderConfigList();
      }
    }

    function moveDown(index) {
      if (index < selectedColumns.length - 1) {
        const temp = selectedColumns[index];
        selectedColumns[index] = selectedColumns[index + 1];
        selectedColumns[index + 1] = temp;
        renderConfigList();
      }
    }

    // Step 3 Logic
    function generateDiagram() {
       chartTitle = document.getElementById('chart-title').value;

       document.getElementById('step-1').classList.add('hidden');
       document.getElementById('step-2').classList.add('hidden');
       document.getElementById('step-3').classList.remove('hidden');

       const container = document.getElementById('chart-container');
       container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400 text-xs py-8 animate-pulse">Generating diagram...</div>';

       google.script.run
         .withSuccessHandler(renderChart)
         .withFailureHandler(err => {
            container.innerHTML = `<div class="text-rose-600 text-xs p-4 bg-rose-50 border border-rose-100 rounded-xl m-4">Error: ${err.message}</div>`;
            console.error(err);
         })
         .generateSankeyData({ columns: selectedColumns });
    }

    function renderChart(data) {
       lastChartData = data;
       const container = document.getElementById('chart-container');
       container.innerHTML = '';

       if (!data.nodes || data.nodes.length === 0 || !data.links || data.links.length === 0) {
           container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400 text-xs">No connections found in selected data columns.</div>';
           return;
       }

       if (chartInstance) {
         chartInstance.dispose();
       }

       chartInstance = echarts.init(container);
       const option = getChartOption(data);
       chartInstance.setOption(option);

       window.addEventListener('resize', function() {
           chartInstance.resize();
       });
       document.addEventListener('fullscreenchange', function() {
           chartInstance.resize();
       });
    }

    function toggleFullscreen() {
        const container = document.getElementById('chart-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                showToast(`Error: ${err.message}`, "error");
            });
        } else {
            document.exitFullscreen();
        }
    }

    function getChartOption(data) {
      return {
          title: {
              text: chartTitle || 'Sankey Flow Diagram',
              left: 'center',
              top: 10,
              textStyle: {
                 fontFamily: 'Inter, sans-serif',
                 fontWeight: 'bold',
                 fontSize: 15
              }
          },
          tooltip: {
              trigger: 'item',
              triggerOn: 'mousemove'
          },
          toolbox: {
              show: true,
              feature: {
                  dataView: { show: true, readOnly: false },
                  restore: { show: true },
                  saveAsImage: { show: true }
              },
              right: 20
          },
          series: [
              {
                  type: 'sankey',
                  left: '5%',
                  right: '5%',
                  top: '12%',
                  bottom: '8%',
                  data: data.nodes,
                  links: data.links,
                  emphasis: {
                      focus: 'adjacency'
                  },
                  lineStyle: {
                      color: 'gradient',
                      curveness: 0.5
                  },
                  label: {
                     fontFamily: 'Inter, sans-serif',
                     fontSize: 11
                  }
              }
          ]
      };
    }

    function downloadChart(type) {
       const safeTitle = (chartTitle || 'SankeyDiagram').replace(/[^a-z0-9]/gi, '_');
       const filename = `${safeTitle}.${type}`;

       if (type === 'svg') {
         downloadSVG(filename);
       } else {
         if (!chartInstance) return;
         const url = chartInstance.getDataURL({
             type: type,
             pixelRatio: 2,
             backgroundColor: '#fff'
         });
         triggerDownload(url, filename);
       }
    }

    function downloadSVG(filename) {
      if (!lastChartData) return;

      const container = document.getElementById('chart-container');
      const fixedHeight = container.clientHeight || 600;
      const fixedWidth = container.clientWidth || 1000;

      const div = document.createElement('div');
      div.style.visibility = 'hidden';
      div.style.width = fixedWidth + 'px';
      div.style.height = fixedHeight + 'px';
      div.style.position = 'absolute';
      div.style.top = '0';
      div.style.left = '0';
      document.body.appendChild(div);

      const tempChart = echarts.init(div, null, { renderer: 'svg' });
      tempChart.setOption(getChartOption(lastChartData));

      const url = tempChart.getDataURL({
        type: 'svg',
        backgroundColor: '#fff'
      });

      triggerDownload(url, filename);

      tempChart.dispose();
      document.body.removeChild(div);
    }

    function triggerDownload(url, filename) {
       const link = document.createElement('a');
       link.download = filename;
       link.href = url;
       document.body.appendChild(link);
       link.click();
       document.body.removeChild(link);
    }
  </script>
</body>
</html>
