<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 550px;
      margin: 0 auto;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      padding: 24px;
    }
    h2 {
      margin-top: 0;
      font-size: 22px;
      font-weight: 700;
      color: #1e1b4b;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .description {
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #475569;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      transition: all 0.15s ease-in-out;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
      background-color: white;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    textarea {
      height: 120px;
      font-family: monospace;
      font-size: 12px;
      resize: none;
    }
    .buttons {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      border: none;
    }
    .btn-secondary {
      background-color: #f1f5f9;
      color: #475569;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }
    .btn-primary {
      background-color: #6366f1;
      color: white;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .btn-primary:hover {
      background-color: #4f46e5;
    }
    .btn-primary:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }
    .loader {
      display: none;
      font-style: italic;
      color: #6366f1;
      font-size: 14px;
      margin-bottom: 15px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>
      <svg class="spinner" style="display:none; width: 16px; height: 16px; border-width: 3px;" id="loadingSpinner"></svg>
      Umbrellanizer (Data Categorizer)
    </h2>
    
    <div id="loader" class="loader">
      <span class="spinner"></span> <span id="loaderText">Loading columns...</span>
    </div>

    <div id="mainForm">
      <div class="description">
        Standardize and group categories autonomously inside <code>05_Synthesis</code>. The LLM standardizes unique terms into standard categories and writes the results to an adjacent <code>_Umbrella</code> column.
      </div>

      <div class="form-group">
        <label for="columnSelect">Column to Process</label>
        <select id="columnSelect">
          <option value="">Loading columns...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cardinalitySelect">Output Cardinality</label>
        <select id="cardinalitySelect">
          <option value="single">Single Value per cell (Enforces 1:1 mapping)</option>
          <option value="multi">Comma-Separated Multi-Value (Allows multiple categories)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="promptPreview">System Prompt Preview</label>
        <textarea id="promptPreview" readonly></textarea>
      </div>

      <div class="buttons">
        <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button class="btn-primary" id="executeBtn" onclick="executeUmbrellanizer()" disabled>Execute</button>
      </div>
    </div>
  </div>

  <script>
    // Secure Toast Notification System
    function showToast(message, type = 'success') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;font-family:sans-serif;';
        document.body.appendChild(container);
      }
      
      const toast = document.createElement('div');
      toast.style.cssText = 'padding:12px 16px;border-radius:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1);border:1px solid;font-size:12px;font-weight:500;transition:all 300ms ease;transform:translateY(8px);opacity:0;display:flex;align-items:center;min-width:250px;max-width:380px;box-sizing:border-box;';
      
      const isSuccess = type === 'success';
      if (isSuccess) {
        toast.style.backgroundColor = '#ecfdf5';
        toast.style.color = '#065f46';
        toast.style.borderColor = '#a7f3d0';
      } else {
        toast.style.backgroundColor = '#fff1f2';
        toast.style.color = '#9f1239';
        toast.style.borderColor = '#fecdd3';
      }
      
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('style', 'width:16px;height:16px;flex-shrink:0;margin-right:8px;');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('viewBox', '0 0 24 24');
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('d', isSuccess ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z');
      
      svg.appendChild(path);
      toast.appendChild(svg);
      
      const span = document.createElement('span');
      span.style.cssText = 'flex-grow:1;';
      span.textContent = message;
      toast.appendChild(span);
      
      container.appendChild(toast);
      toast.offsetHeight; // Force reflow
      
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      
      setTimeout(() => {
        toast.style.transform = 'translateY(8px)';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Mock environment support for local testing
    if (typeof google === 'undefined') {
      window.google = {
        script: {
          run: {
            withSuccessHandler: function(handler) {
              this.successHandler = handler;
              return this;
            },
            withFailureHandler: function(handler) {
              this.failureHandler = handler;
              return this;
            },
            getUmbrellanizerColumns: function() {
              setTimeout(() => this.successHandler(['rq1_primary_domain_Value', 'rq2_protocols_Value', 'rq3_predictive_models_Value']), 500);
            },
            getUmbrellanizerPrompt: function() {
              setTimeout(() => this.successHandler('Mock System Prompt Instruction...'), 500);
            },
            applyUmbrellanizer: function(colName, repType) {
              setTimeout(() => this.successHandler('Success'), 1500);
            },
            host: {
              close: function() { console.log("Dialog closed."); }
            }
          }
        }
      };
    }

    window.onload = function() {
      showLoader(true, "Loading configuration...");
      
      // Load prompt preview
      google.script.run
        .withSuccessHandler(function(prompt) {
          document.getElementById('promptPreview').value = prompt;
          
          // Load columns
          google.script.run
            .withSuccessHandler(populateColumns)
            .withFailureHandler(showError)
            .getUmbrellanizerColumns();
        })
        .withFailureHandler(showError)
        .getUmbrellanizerPrompt();
    };

    function showLoader(show, text) {
      document.getElementById('loader').style.display = show ? 'block' : 'none';
      if (text) {
        document.getElementById('loaderText').innerText = text;
      }
      document.getElementById('loadingSpinner').style.display = show ? 'inline-block' : 'none';
    }

    function showError(err) {
      showLoader(false);
      showToast("Error: " + (err.message || err), "error");
    }

    function populateColumns(columns) {
      showLoader(false);
      const select = document.getElementById('columnSelect');
      select.innerHTML = '';

      if (!columns || columns.length === 0) {
        select.innerHTML = '<option value="">No valid value columns found in 05_Synthesis</option>';
        document.getElementById('executeBtn').disabled = true;
        return;
      }

      columns.forEach(col => {
        const option = document.createElement('option');
        option.value = col;
        option.textContent = col;
        select.appendChild(option);
      });

      document.getElementById('executeBtn').disabled = false;
    }

    function executeUmbrellanizer() {
      const colName = document.getElementById('columnSelect').value;
      const repType = document.getElementById('cardinalitySelect').value;

      if (!colName) {
        showToast("Please select a column to process.", "error");
        return;
      }

      showLoader(true, "Processing. Calling LLM standardizer...");
      const btn = document.getElementById('executeBtn');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function(msg) {
          showLoader(false);
          showToast("Umbrellanizer execution completed successfully!", "success");
          setTimeout(() => google.script.host.close(), 1000);
        })
        .withFailureHandler(function(err) {
          showLoader(false);
          btn.disabled = false;
          showError(err);
        })
        .applyUmbrellanizer(colName, repType);
    }
  </script>
</body>
</html>
