name: Release Standalone Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.51). If left blank, automatically uses version from slr-viewer/package.json.'
        required: false
        default: ''
      prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Single-File HTMLs & Cross-Platform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix slr-viewer install
          npm --prefix inter-rater install

      - name: Mirror Assets to Viewer
        run: npm run mirror:viewer

      - name: Build Standalone Single-File Frontends
        run: |
          npm run build:standalone:viewer
          npm run build:standalone:inter-rater

      - name: Extract Versions & Resolve Release Tag
        id: vars
        run: |
          VIEWER_VER=$(node -p "require('./slr-viewer/package.json').version")
          INTER_RATER_VER=$(node -p "require('./inter-rater/package.json').version")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VIEWER_VER}"
          fi

          echo "viewer_version=$VIEWER_VER" >> $GITHUB_OUTPUT
          echo "inter_rater_version=$INTER_RATER_VER" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG"

      - name: Stage Viewer HTML & Fonts for Go Embed
        run: |
          mkdir -p launcher/dist
          cp slr-viewer/dist/index.html launcher/dist/index.html
          mkdir -p launcher/dist/fonts
          cp -r slr-viewer/public/fonts/* launcher/dist/fonts/ || true

      - name: Compile Native Go Launchers (Windows, Linux, macOS)
        env:
          VIEWER_VER: ${{ steps.vars.outputs.viewer_version }}
          BUILD_TIME: ${{ steps.vars.outputs.build_time }}
        run: |
          LDFLAGS="-s -w -X main.AppVersion=v${VIEWER_VER} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p dist-standalone

          echo "Compiling Windows AMD64..."
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o dist-standalone/slr-viewer-windows-amd64.exe ./launcher
          cp dist-standalone/slr-viewer-windows-amd64.exe dist-standalone/slr-viewer.exe

          echo "Compiling Linux AMD64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o dist-standalone/slr-viewer-linux-amd64 ./launcher

          echo "Compiling macOS Darwin AMD64 (Intel)..."
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o dist-standalone/slr-viewer-darwin-amd64 ./launcher

          echo "Compiling macOS Darwin ARM64 (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o dist-standalone/slr-viewer-darwin-arm64 ./launcher

      - name: Generate Checksums (SHA256SUMS.txt)
        run: |
          cd dist-standalone
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's| \./|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "SLR Magic Release ${{ steps.vars.outputs.release_tag }}"
          files: dist-standalone/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
