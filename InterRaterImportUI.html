<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; font-family: sans-serif; }
      .spinner-border { display: none; margin-right: 10px; }
      #result-container { display: none; }
    </style>
  </head>
  <body>
    <h5>Import Blinded Results (.slr)</h5>
    <p>Upload the completed .slr file from the reviewers.</p>

    <div id="form-container">
      <div class="mb-3">
        <input type="file" class="form-control" id="fileInput" accept=".slr,.json">
      </div>

      <button id="importBtn" class="btn btn-primary" onclick="startImport()">
        <span class="spinner-border spinner-border-sm" id="loadingSpinner" role="status" aria-hidden="true"></span>
        Import
      </button>
    </div>

    <div id="result-container" class="alert alert-info mt-3"></div>

    <script>
      const phase = "<?= phase ?>"; // Passed from server

      function startImport() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
          alert("Please select a file first.");
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
          const contents = e.target.result;

          document.getElementById('importBtn').disabled = true;
          document.getElementById('loadingSpinner').style.display = 'inline-block';

          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .processInterRaterImport(phase, contents);
        };

        reader.readAsText(file);
      }

      function onSuccess(response) {
        document.getElementById('importBtn').disabled = false;
        document.getElementById('loadingSpinner').style.display = 'none';

        const resContainer = document.getElementById('result-container');
        resContainer.style.display = 'block';
        resContainer.innerText = response;
      }

      function onFailure(error) {
        document.getElementById('importBtn').disabled = false;
        document.getElementById('loadingSpinner').style.display = 'none';
        alert("Import failed: " + error.message);
      }
    </script>
  </body>
</html>
